name: Title plugin tests

on:
  push:
    paths:
      - 'plugins/auto-thread-title/**'
      - '.github/workflows/title-plugin-tests.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths:
      - 'plugins/auto-thread-title/**'
      - '.github/workflows/title-plugin-tests.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    defaults:
      run:
        working-directory: plugins/auto-thread-title
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Runtime version
        run: node --version
      - name: Synthetic unit and process tests
        run: node --test
