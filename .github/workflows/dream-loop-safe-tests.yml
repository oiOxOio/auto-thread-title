name: Dream Loop Safe tests

on:
  push:
    paths:
      - 'plugins/dream-loop-safe/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/dream-loop-safe-tests.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'plugins/dream-loop-safe/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/dream-loop-safe-tests.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    defaults:
      run:
        working-directory: plugins/dream-loop-safe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Runtime version
        run: node --version
      - name: Static package and policy regression tests
        run: node --test
